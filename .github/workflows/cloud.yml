name: Test server

# Sets up / updates the hosted test server (Supabase Cloud + Vercel). See docs/MOBILE.md.
on:
  workflow_dispatch:
  push:
    branches: [phase-7-ios]
    paths:
      [
        'supabase/migrations/**',
        'supabase/seeds/**',
        'supabase/samples/**',
        'apps/web/**',
        'packages/core/**',
        'scripts/cloud-setup.sh',
        'scripts/check-secrets.sh',
      ]

concurrency:
  group: cloud
  cancel-in-progress: false

permissions:
  contents: write # the screenshots job pushes to the `screenshots` branch

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      # Only for the secrets check (the iOS workflow uses these).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets look right (names and OK/problem only)
        run: scripts/check-secrets.sh
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Supabase/Vercel secrets are not set yet, skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.ready == 'true'
        run: scripts/cloud-setup.sh

  # Screenshots of the deployed site (public pages, signed out) on the `screenshots` branch, so the
  # design can be reviewed without opening the site.
  screenshots:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paraapp/web exec playwright install --with-deps chromium
      - run: node apps/web/scripts/screenshots.mjs https://fly-anatolia.vercel.app "$RUNNER_TEMP/shots"
      - name: Push to the screenshots branch
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
