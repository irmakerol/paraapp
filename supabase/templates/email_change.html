<!doctype html>
<html>
  <body
    style="
      font-family: system-ui, sans-serif;
      color: #13262b;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    "
  >
    <h2>Yeni e-posta adresini onayla</h2>
    <p>E-posta adresini değiştirmek için aşağıdaki düğmeye tıkla.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next={{ .RedirectTo }}"
        style="
          display: inline-block;
          background: #0f4049;
          color: #fff;
          padding: 12px 20px;
          border-radius: 8px;
          text-decoration: none;
        "
        >Onayla</a
      >
    </p>
    <hr style="border: none; border-top: 1px solid #d9dedf; margin: 24px 0" />
    <h2>Confirm your new email</h2>
    <p>Click the link below to confirm your new email address.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next={{ .RedirectTo }}"
        >Confirm</a
      >
    </p>
    <p style="color: #5b6b70; font-size: 13px">
      Fly Anatolia Havacılık Kulübü · info@flyanatolia.com
    </p>
  </body>
</html>
